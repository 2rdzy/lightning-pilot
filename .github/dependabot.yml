# Dependency policy rule 8: weekly, grouped, never merged automatically; every update is a reviewed PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Same rule as pnpm's minimumReleaseAge: a version is proposed only once it is 7 days old.
    cooldown:
      default-days: 7
    ignore:
      # Node's type definitions follow the Node line the app runs on (24, .nvmrc), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      runtime:
        dependency-type: production
      development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
