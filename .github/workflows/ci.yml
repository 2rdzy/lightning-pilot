# Checks on every pull request and on main (vault plan/ci.md §2). Actions are pinned by commit; the token is
# read-only; pull requests run with `pull_request` only, never `pull_request_target`, and use no secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm (version from package.json)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm format:check
      - name: Lint (including module boundaries)
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Licences of shipped dependencies
        run: pnpm licenses:check
      - name: Known vulnerabilities in shipped dependencies
        run: pnpm audit:prod

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm (version from package.json)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Tests
        run: pnpm test
