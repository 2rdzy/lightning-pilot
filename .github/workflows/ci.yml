# Checks on every pull request and on main (vault plan/ci.md §2). Actions are pinned by commit; the token is
# read-only; pull requests run with `pull_request` only, never `pull_request_target`, and use no secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm (version from package.json)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm format:check
      - name: Lint (including module boundaries)
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Licences of shipped dependencies
        run: pnpm licenses:check
      - name: Known vulnerabilities in shipped dependencies
        run: pnpm audit:prod

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm (version from package.json)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      # Unit, API and security tests with the coverage gates of vitest.config.ts.
      - name: Tests with coverage gates
        run: pnpm test:coverage
      # The server's tests again on the fallback SQLite driver, so it can be switched if node:sqlite changes.
      - name: Server tests on better-sqlite3
        run: pnpm test:better-sqlite3

  # Adapter contract tests and the walking-skeleton end-to-end test against real nodes, one job per chain. The
  # nodes are pinned releases (tools/regtest/versions.json), checked against their SHA-256 before use; downloads are
  # cached by that file's hash. The runner image is pinned to the Ubuntu release the CLN tarballs are built for.
  contract:
    name: contract-${{ matrix.chain }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        chain: [blake2b, sha256d]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm (version from package.json)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Libraries the Core Lightning release needs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq5 libsodium23 libsqlite3-0
      - name: Cache node downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .regtest/cache
          key: regtest-${{ matrix.chain }}-${{ hashFiles('tools/regtest/versions.json') }}
      - name: Fetch and verify the pinned nodes
        run: tools/regtest/regtest ${{ matrix.chain }} fetch
      - name: Start the nodes and open the channels
        run: tools/regtest/regtest ${{ matrix.chain }} init
      - name: Smoke test
        run: tools/regtest/regtest ${{ matrix.chain }} check
      - name: Contract and end-to-end tests
        run: pnpm test:regtest
        env:
          LP_REGTEST_CHAIN: ${{ matrix.chain }}
      - name: Stop the nodes
        if: always()
        run: tools/regtest/regtest ${{ matrix.chain }} down

  # The walking skeleton in the browser (Playwright, Chromium at desktop and phone size) against the built web app
  # served by the server: first with fake nodes, then with the BLAKE2b regtest nodes (one chain is enough here; the
  # contract jobs cover both). The browser is downloaded by Playwright itself, outside npm, at the version that
  # matches the locked @playwright/test.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm (version from package.json)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build the web app
        run: pnpm build:web
      - name: Browser for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests with fake nodes
        run: pnpm test:e2e
      - name: Libraries the Core Lightning release needs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq5 libsodium23 libsqlite3-0
      - name: Cache node downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .regtest/cache
          key: regtest-blake2b-${{ hashFiles('tools/regtest/versions.json') }}
      - name: Fetch, verify and start the BLAKE2b regtest nodes
        run: tools/regtest/regtest blake2b fetch && tools/regtest/regtest blake2b init
      - name: Browser tests with the BLAKE2b regtest nodes
        run: pnpm test:e2e
        env:
          E2E_NODES: regtest
          LP_REGTEST_CHAIN: blake2b
      - name: Stop the nodes
        if: always()
        run: tools/regtest/regtest blake2b down
      - name: Keep the Playwright report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
